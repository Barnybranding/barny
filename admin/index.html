<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Workspace | Barny Branding Co.</title><link rel="stylesheet" href="../assets/css/portal.css"></head><body><div class="admin-bar"><div class="portal-wrap">Barny Branding Co. — Authorized administration<span class="role-badge" id="roleBadge" hidden></span></div></div><header class="portal-header"><div class="portal-wrap"><a href="../barny-ordering-site.html"><img class="portal-logo" src="../assets/images/barny-logo.jpg" alt="Barny Branding Co."></a><div class="header-actions"><div id="notifBellContainer"></div><button class="button secondary" id="logout">Log out</button></div></div></header><main class="dashboard"><div class="portal-wrap"><div class="dashboard-head"><div><h1>Agent workspace</h1><p>Claim quote requests, chat with customers, and manage orders.</p></div></div><div class="message" id="message"></div><div class="dashboard-grid"><nav class="sidebar"><button class="active" data-panel="waitingPanel">Waiting list</button><button data-panel="minePanel">My chats</button><button data-panel="allPanel" id="allOrdersTab" hidden>All orders</button><a href="./agents.html" id="agentsLink" hidden>Manage agents</a><a href="./catalogue.html" id="catalogueLink" hidden>Manage catalogue</a><a href="../account/dashboard.html">Customer view</a><a href="../barny-ordering-site.html">Website</a></nav><div><section class="panel dashboard-panel" id="waitingPanel"><h2>Waiting list</h2><p style="color:var(--muted);margin-top:-8px">Unclaimed quote requests. Anyone can claim one.</p><div class="orders" id="waitingOrders"><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div></div></section><section class="panel dashboard-panel" id="minePanel" hidden><h2>My chats</h2><div class="orders" id="mineOrders"><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div></div></section><section class="panel dashboard-panel" id="allPanel" hidden><h2>All orders</h2><div class="orders" id="allOrders"><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div></div></section><section class="panel" id="editor" hidden style="margin-top:18px"><h2>Manage <span id="selectedNumber"></span> <button class="button secondary" id="takeOverBtn" hidden type="button">Take over</button></h2><p class="claimed-by" id="claimedByLabel"></p><div id="chatContainer"></div><form id="adminOrderForm" class="admin-form"><label>Order status<select id="orderStatus"><option value="quote_requested">Quote requested</option><option value="under_review">Under review</option><option value="negotiating">Negotiating</option><option value="quote_sent">Quote sent</option><option value="quote_agreed">Quote agreed</option><option value="artwork_pending">Artwork pending</option><option value="artwork_review">Artwork review</option><option value="artwork_approved">Artwork approved</option><option value="in_production">In production</option><option value="quality_check">Quality check</option><option value="ready_for_delivery">Ready for delivery</option><option value="completed">Completed</option><option value="on_hold">On hold</option><option value="cancelled">Cancelled</option></select></label><label>Payment status<select id="paymentStatus"><option value="not_set">Not set</option><option value="quote_pending">Quote pending</option><option value="unpaid">Unpaid</option><option value="partially_paid">Partially paid</option><option value="paid">Paid</option><option value="refunded">Refunded</option><option value="cancelled">Cancelled</option></select></label><label>Delivery status<select id="deliveryStatus"><option value="not_scheduled">Not scheduled</option><option value="scheduled">Scheduled</option><option value="processing">Processing</option><option value="ready_for_dispatch">Ready for dispatch</option><option value="dispatched">Dispatched</option><option value="in_transit">In transit</option><option value="ready_for_collection">Ready for collection</option><option value="delivered">Delivered</option><option value="delivery_failed">Delivery failed</option><option value="returned">Returned</option><option value="cancelled">Cancelled</option></select></label><label>Total amount<input id="totalAmount" type="number" min="0" step="0.01"></label><label>Expected delivery<input id="expectedDate" type="date"></label><label>Tracking number<input id="trackingNumber"></label><label style="grid-column:1/-1">Delivery address<textarea id="deliveryAddress"></textarea></label><label style="grid-column:1/-1">Internal/customer notes<textarea id="notes"></textarea></label><button class="button" type="submit">Save order update</button></form></section></div></div></div></main><script type="module" src="../assets/js/admin-page.js"></script></body></html>
