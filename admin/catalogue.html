<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Catalogue | Barny Branding Co.</title><link rel="stylesheet" href="../assets/css/portal.css"></head><body><div class="admin-bar"><div class="portal-wrap">Barny Branding Co. — Authorized administration<span class="role-badge">Super Admin</span></div></div><header class="portal-header"><div class="portal-wrap"><a href="../barny-ordering-site.html"><img class="portal-logo" src="../assets/images/barny-logo.jpg" alt="Barny Branding Co."></a><div class="header-actions"><div id="notifBellContainer"></div><button class="button secondary" id="logout">Log out</button></div></div></header><main class="dashboard"><div class="portal-wrap"><div class="dashboard-head"><div><h1>Manage catalogue</h1><p>Categories and products shown on the storefront — nothing here is hardcoded.</p></div></div><div class="message" id="message"></div><div class="dashboard-grid"><nav class="sidebar"><a href="./index.html">Waiting list</a><a href="./index.html">My chats</a><a href="./agents.html">Manage agents</a><a class="active" href="./catalogue.html">Manage catalogue</a><a href="../account/dashboard.html">Customer view</a><a href="../barny-ordering-site.html">Website</a></nav><div>

<section class="panel"><h2>Categories</h2><form id="categoryForm" class="admin-form" style="grid-template-columns:2fr 1fr auto"><label>Name<input id="categoryName" required placeholder="e.g. Vehicle & Fleet Branding"></label><label>Sort order<input id="categorySort" type="number" value="0"></label><div style="align-self:end"><button class="button" type="submit">Add category</button></div></form><div class="orders" id="categoryList" style="margin-top:14px"><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div></div></section>

<section class="panel" style="margin-top:18px"><h2 id="productFormHeading">Add a product</h2><form id="productForm" class="admin-form"><input type="hidden" id="productId"><label>Name<input id="productName" required></label><label>Category<select id="productCategory" required></select></label><label style="grid-column:1/-1">Description<textarea id="productDescription" rows="2"></textarea></label><label>Image<input id="productImage" type="file" accept="image/*"></label><label>Sort order<input id="productSort" type="number" value="0"></label><label><input id="productActive" type="checkbox" checked style="width:auto;display:inline-block;margin-right:6px">Active (visible on storefront)</label><div style="grid-column:1/-1;display:flex;gap:10px"><button class="button" type="submit">Save product</button><button class="button secondary" type="button" id="productCancel" hidden>Cancel edit</button></div></form></section>

<section class="panel" style="margin-top:18px"><h2>Products</h2><div class="orders" id="productList"><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div></div></section>

</div></div></div></main><script type="module" src="../assets/js/catalogue-admin.js"></script></body></html>
