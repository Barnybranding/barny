<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | Barny Branding Co.</title><link rel="stylesheet" href="../assets/css/portal.css"></head><body data-page="register"><header class="portal-header"><div class="portal-wrap"><a href="../barny-ordering-site.html"><img class="portal-logo" src="../assets/images/barny-logo.jpg" alt="Barny Branding Co."></a><a class="back-link" href="../barny-ordering-site.html">← Back to website</a></div></header><main class="auth-shell"><section class="auth-card"><h1>Create your account</h1><p class="intro">Register through Supabase Authentication to manage your Barny orders securely.</p><div class="message" id="message"></div><form id="registerForm"><div class="field"><label for="fullName">Full name</label><input id="fullName" autocomplete="name" required></div><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="phone">Phone number</label><input id="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="e.g. 08157008833" required></div><div class="field"><label for="companyName">Company/Organization name</label><input id="companyName" autocomplete="organization" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="passwordHint"><small id="passwordHint">At least 8 characters, including a letter and a number.</small></div><div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></div><button class="button full" type="submit">Create account</button></form><div class="auth-links"><span>Already registered?</span><a href="./login.html">Sign in</a></div></section></main><script type="module" src="../assets/js/account-page.js"></script></body></html>
